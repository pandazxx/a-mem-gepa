# Default run config. Copy + override per experiment rather than editing
# this in place once experiments start (see docs/experiments/README.md).

dataset:
  name: locomo
  split_manifest: configs/locomo_split.json

models:
  # A-MEM's own LLM backend (the system under test) -- LiteLLM model-id string.
  amem_llm_model: ${AMEM_LLM_MODEL}
  amem_embedding_model: ${AMEM_EMBEDDING_MODEL}
  # Only meaningful for ollama-routed models; harmless to leave set otherwise.
  amem_llm_api_base: ${OLLAMA_API_BASE}
  # GEPA optimization roles (docs/decisions/0003).
  gepa_task_lm: ${GEPA_TASK_LM}
  gepa_reflection_lm: ${GEPA_REFLECTION_LM}
  # Paper reproduction (docs/decisions/0013) -- separate from amem_llm_model
  # above: WujiangXu/AgenticMemory's own backend/model naming, bare model
  # name, not a LiteLLM-prefixed string.
  paper_repro_backend: ${PAPER_REPRO_BACKEND}
  paper_repro_model: ${PAPER_REPRO_MODEL}

gepa:
  # Budget arithmetic (docs/decisions/0015): GEPA counts one metric call per
  # batch element. A full val eval costs len(valset) (~150) calls and happens
  # once for the seed + once per *accepted* candidate; a reflection minibatch
  # costs reflection_minibatch_size calls per iteration. 2000 ≈ seed val
  # (150) + ~11 accepted candidates (1650) + ~100 minibatch evals -- the
  # dollar cost is dominated by memory *builds*, not metric calls, so
  # confirm both with the run plan (`just gepa-optimize`, no --yes) first.
  max_metric_calls: 2000
  # One minibatch element = one LoCoMoQuestionGroup = one memory build.
  reflection_minibatch_size: 2
  train_questions_per_category: 3
  val_questions_per_category_per_conversation: 15
  val_subset_manifest: configs/gepa_val_subset.json
  retrieve_k: 10
  temperature_c5: 0.5
  # "refusal" (default): adversarial questions score 1.0 when the model
  # picks "Not mentioned in the conversation" -- the paper's stated intent
  # for category 5. "paper": their calculate_metrics against the trap text
  # (the sign-ambiguous direction documented in docs/decisions/0013).
  adversarial_scoring: refusal
  cache_dir: results/gepa_cache
  # The paper's verbatim prompts (docs/decisions/0014) -- 4 components
  # matching the repro pipeline, generated from llm_text_parsers' constants.
  seed_candidate_dir: src/amem_gepa/prompts/baseline_repro

# Overrides applied on top of `gepa:` when run_gepa_optimize.py gets
# --smoke (`just gepa-smoke`): a tiny sanity pass on truncated
# conversations that exercises build -> cache -> QA -> reflection ->
# acceptance -> val end to end. Sized for a local model: ~40-turn builds
# (minutes each, vs ~1h full), 2 train conversations, <=10 val questions.
# Numbers from a smoke run are meaningless -- plumbing only
# (docs/decisions/0015).
gepa_smoke:
  max_turns: 40
  train_conversations: 2
  train_questions_per_category: 1
  val_questions_per_category_per_conversation: 1
  reflection_minibatch_size: 1
  # ~ seed val (<=10) + ~15 minibatch iterations + 1-2 accepted val evals
  max_metric_calls: 45

evaluation:
  # Which split run_baseline.py/run_eval.py score by default (docs/decisions/0004).
  split: test
  # Top-k memories retrieved per question (search_agentic, docs/decisions/0006).
  retrieval_k: 10
  qa_prompt: src/amem_gepa/prompts/qa_answer.txt
  # Bootstrap CI resamples for the headline test-set metric (docs/decisions/0004).
  bootstrap_resamples: 10000

# Paper reproduction (docs/decisions/0013, `just reproduce`) -- full 10-
# conversation LoCoMo dataset, no train/val/test split (that split is only
# for the later GEPA comparison phase, not part of the paper's own benchmark).
paper_repro:
  retrieve_k: 10  # their default; the paper's headline numbers used a per-model k-sweep
  ratio: 1.0       # fraction of the 10 conversations to evaluate; 1.0 = all
  temperature_c5: 0.5  # matches their --temperature_c5 default
