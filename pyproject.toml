[project]
name = "amem-gepa"
version = "0.1.0"
description = "Optimizing A-MEM's memory-management prompts with GEPA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agentic-memory",
  "gepa>=0.1.0",
  "litellm>=1.50.0",
  "chromadb>=0.5.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "nltk>=3.8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amem_gepa"]

[tool.uv.sources]
# external/a-mem is the agiresearch/A-mem git submodule (see docs/decisions/0001)
agentic-memory = { path = "external/a-mem", editable = true }

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
