[project]
name = "amem-gepa"
version = "0.1.0"
description = "Optimizing A-MEM's memory-management prompts with GEPA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agentic-memory",
  "gepa>=0.1.0",
  "litellm>=1.50.0",
  "chromadb>=0.5.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "nltk>=3.8.1",
  # Paper reproduction (docs/decisions/0013): dependencies of
  # external/agentic-memory-repro/, whose modules we import directly rather
  # than reimplementing.
  "ollama>=0.3.0",
  "rouge-score>=0.1.2",
  "bert-score>=0.3.13",
  "pandas>=2.0.0",
  "tqdm>=4.66.0",
  # Only reachable via PAPER_REPRO_BACKEND=openai (e.g. routed through
  # OpenRouter -- see .env.example, docs/decisions/0013). Not pulled in by
  # backend=ollama, so needs to be listed explicitly.
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amem_gepa"]

[tool.uv.sources]
# external/a-mem is the agiresearch/A-mem git submodule (see docs/decisions/0001)
agentic-memory = { path = "external/a-mem", editable = true }

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
